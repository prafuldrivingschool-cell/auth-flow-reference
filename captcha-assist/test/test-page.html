<!doctype html><html lang="en"><head><meta charset="utf-8"><title>Captcha Assist Test</title><style>body{font:16px system-ui;max-width:700px;margin:40px auto;padding:20px}section{border:1px solid #ccc;padding:20px;margin:20px 0}canvas{image-rendering:pixelated;border:1px solid #888}button,input{padding:8px;margin:5px}</style></head><body><h1>Captcha Assist Test Page</h1><p>This page is for local extension testing. It intentionally does not implement real CAPTCHA verification.</p><section><label for="captcha1">Captcha :</label><input id="captcha1" placeholder="Enter Captcha Here" autocomplete="off"><div><canvas id="image1" width="240" height="80"></canvas></div><button id="refresh1">Refresh CAPTCHA</button></section><button id="add">Add CAPTCHA dynamically</button><script>"use strict";function draw(id){const c=document.getElementById(id),x=c.getContext('2d');x.fillStyle='#eee';x.fillRect(0,0,c.width,c.height);x.fillStyle='#111';x.font='bold 38px sans-serif';const s=Math.random().toString(36).slice(2,8).toUpperCase();x.rotate((Math.random()-.5)/8);x.fillText(s,35,52);for(let i=0;i<9;i++){x.strokeStyle='#555';x.beginPath();x.moveTo(Math.random()*240,Math.random()*80);x.lineTo(Math.random()*240,Math.random()*80);x.stroke();}x.setTransform(1,0,0,1,0,0)}draw('image1');document.getElementById('refresh1').onclick=()=>draw('image1');document.getElementById('add').onclick=()=>{const n=document.createElement('section');n.innerHTML='<label>Security code</label><input placeholder="verification code"><img alt="captcha test" width="240" height="80">';document.body.appendChild(n);const c=document.createElement('canvas');c.width=240;c.height=80;c.style.display='none';document.body.appendChild(c);};</script></body></html>
